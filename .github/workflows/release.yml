name: Release

on:
  release:
    types: [published]
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: main
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # TCV-6668: OIDC trusted publishing needs npm >= 11.5.1; Node 22 ships ~10.9.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      # TCV-6794: the release tag decides the published version. Passing it
      # explicitly means a `release` event (whose ref is the default branch, not
      # the tag) still resolves the right version.
      - name: Set version from release tag
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        run: node scripts/bump-version.js
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test



      # TCV-6668: authenticate via OIDC trusted publishing (configured on npmjs.com),
      # not a long-lived NPM_TOKEN — npm is deprecating 2FA-bypass tokens. The job's
      # id-token: write permission supplies the OIDC identity; provenance is automatic.
      # Fail before publishing if the package version and the tag ever diverge,
      # rather than shipping a mismatched version to npm.
      - name: Verify version matches the tag
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        run: |
          set -e
          TAG="${RELEASE_TAG#refs/tags/}"
          TAG="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          case "$TAG" in
            *.*.*) EXPECTED="$TAG" ;;
            *.*)   EXPECTED="$TAG.0" ;;
            *)     echo "Tag '$RELEASE_TAG' is not a version tag"; exit 1 ;;
          esac
          if [ "$PKG" != "$EXPECTED" ]; then
            echo "Version mismatch: tag $RELEASE_TAG expects $EXPECTED, package.json has $PKG"
            exit 1
          fi
          echo "Publishing $PKG for tag $RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        run: npm publish --access public --provenance
