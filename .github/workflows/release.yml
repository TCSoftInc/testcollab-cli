name: Release

on:
  release:
    types: [published]
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: main
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # TCV-6668: OIDC trusted publishing needs npm >= 11.5.1; Node 22 ships ~10.9.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Bump version
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        run: node scripts/bump-version.js

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test



      # TCV-6668: authenticate via OIDC trusted publishing (configured on npmjs.com),
      # not a long-lived NPM_TOKEN — npm is deprecating 2FA-bypass tokens. The job's
      # id-token: write permission supplies the OIDC identity; provenance is automatic.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        run: npm publish --access public --provenance
